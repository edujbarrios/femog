<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">FEMOG</title>
  <desc id="desc">A neon teal magnifying glass with a Git branch inside, representing engineer discovery.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102a28"/>
      <stop offset="1" stop-color="#071210"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a7f3d0"/>
      <stop offset=".55" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect x="5" y="5" width="118" height="118" rx="28" fill="url(#surface)" stroke="#24524c" stroke-width="1.5"/>
  <g fill="none" stroke="#2dd4bf" stroke-linecap="round" stroke-linejoin="round" opacity=".65" filter="url(#glow)">
    <path d="M76 76 99 99" stroke-width="11"/>
    <circle cx="53" cy="53" r="31" stroke-width="8"/>
    <path d="M43 45v16m0-2q0-7 11-7t11-6" stroke-width="5"/>
    <circle cx="43" cy="39" r="5" stroke-width="4"/>
    <circle cx="43" cy="67" r="5" stroke-width="4"/>
    <circle cx="65" cy="40" r="5" stroke-width="4"/>
  </g>
  <g fill="none" stroke="url(#neon)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M76 76 99 99" stroke-width="9"/>
    <circle cx="53" cy="53" r="31" stroke-width="5.5"/>
  </g>
  <g stroke="#a7f3d0" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M43 45v16m0-2q0-7 11-7t11-6"/>
    <circle cx="43" cy="39" r="5" fill="#102a28"/>
    <circle cx="43" cy="67" r="5" fill="#102a28"/>
    <circle cx="65" cy="40" r="5" fill="#102a28"/>
  </g>
</svg>
